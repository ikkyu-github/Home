name: no-bloat

on:
  pull_request:
  push:
    branches: [ main, master ]

jobs:
  assert-no-bloat:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch PR base ref (for diff-based guards)
        if: github.event_name == 'pull_request'
        run: |
          git fetch origin "${{ github.base_ref }}":"refs/remotes/origin/${{ github.base_ref }}" --depth=1
      - name: Repo guard (no generated artifacts)
        run: |
          chmod +x Scripts/*.sh Dev/Tools/Scripts/*.sh .githooks/pre-commit || true
          Scripts/repo_guard.sh
          Dev/Tools/Scripts/validate_swift_packages.sh

      - name: Architecture guardrails (layering/purity)
        run: |
          chmod +x Dev/Tools/Scripts/*.sh || true
          Dev/Tools/Scripts/architecture_check.sh
